---
- name: Update web servers
  hosts: nexus
  remote_user: root
  become: true

  tasks:
    - name: Crear usuario para el servicio nexus 
      user:
        name: nexus
        system: true
        create_home: false
        shell: /sbin/nologin
        state: present

    - name: Descargar Nexus 
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.90.1-01-linux-x86_64.tar.gz
        dest: /opt/nexus-3.90.1-01-linux-x86_64.tar.gz 
        owner: ubuntu
        group: ubuntu
        mode: '07440'
        checksum: sha256:6f3240f34bb46b99d93b2c512333651ea227b4c65248c8154ae275933c320556
    
    - name: Descomprimir Nexus
      command:
        cmd: tar xvz --keep-directory-symlink -f ./nexus-3.90.1-01-linux-x86_64.tar.gz
        chdir: /opt/
      register: tar_output
      changed_when: true

    - name: Cambiar el propietario de la carpeta de Nexus de forma recursiva
      ansible.builtin.file:
        path: /opt/nexus-3.90.1-01
        owner: nexus
        group: nexus 
        recurse: true
        state: directory
    
    - name: Cambiar el propietario de la carpeta de Nexus de forma recursiva
      ansible.builtin.file:
        path: /opt/sonatype-work
        owner: nexus
        group: nexus 
        recurse: true
        state: directory

    - name: Crear servicio nexus 
      blockinfile:
        path: /etc/systemd/system/nexus.service
        create: true
        block: |
          [Unit]
          Description=nexus service
          After=network.target

          [Service]
          Type=forking
          LimitNOFILE=65536
          ExecStart=/opt/nexus-3.90.1-01/bin/nexus start
          ExecStop=/opt/nexus-3.90.1-01/bin/nexus stop
          User=nexus
          Restart=on-abort
          TimeoutSec=600
          
          [Install]
          WantedBy=multi-user.target
      

    - name: Recargar el daemon de systemd
      systemd:
        daemon_reload: true

    - name: Iniciar y habilitar Nexus service
      service:
        name: nexus.service
        state: started
        enabled: true 

- name: Servidor docker 
  hosts: docker
  remote_user: root
  become: true

  tasks:
    - name: Actualizar repositorio
      apt:
        update_cache: yes
    
    - name: Instalar dependencias
      pkg:
        - ca-certificates
        - curl

    - name: Crear directorio para las llaves 
      ansible.builtin.file:
        path: /etc/apt/keyrings
        mode: '0755'
        state: directory

    - name: Descargar llave GPG docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: 'a+r'

    - name: Agregar repositorio a fuentes de APT
      blockinfile:
        path: /etc/apt/sources.list.d/docker.sources
        create: yes
        mode: '0644'
        block: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
        become: true

    - name: Actualizar repositorio
      apt:
        update_cache: true

    - name: Instalacion de docker 
      apt: 
        pkg: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Habilitar servicio 
      service:
        name: docker 
        state: enabled

    - name: Iniciar servicio
      service:
        name: docker
        state: started

    - name: Añadir el usuario actual al grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

- name: Probar comandos de Docker sin sudo
  hosts: docker
  become: false
  tasks:

    - name: Verificar que Docker responde sin sudo
      ansible.builtin.command: docker ps
      register: docker_output

    - name: Mostrar el resultado
      ansible.builtin.debug:
        var: docker_output.stdout

