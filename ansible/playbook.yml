---
- name: Update web servers
  hosts: nexus
  remote_user: root

  tasks:
    - name: Crear usuario para el servicio nexus 
      user:
        name: nexus
        system: true
        create_home: false
        shell: /sbin/nologin
        state: present

    - name: Descargar Nexus 
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.90.1-01-linux-x86_64.tar.gz
        dest: /opt/nexus-3.90.1-01-linux-x86_64.tar.gz 
        owner: ubuntu
        group: ubuntu
        mode: '07440'
        checksum: sha256:6f3240f34bb46b99d93b2c512333651ea227b4c65248c8154ae275933c320556
    
    - name: Descomprimir Nexus
      command:
        cmd: tar xvz --keep-directory-symlink -f ./nexus-3.90.1-01-linux-x86_64.tar.gz
        chdir: /opt/
        register: tar_output
        changed_when: true

    - name: Cambiar el propietario de la carpeta de Nexus de forma recursiva
      ansible.builtin.file:
        path: /opt/nexus-3.90.1-01
        owner: nexus
        group: nexus 
        recurse: true
        state: directory
    
    - name: Cambiar el propietario de la carpeta de Nexus de forma recursiva
      ansible.builtin.file:
        path: /opt/sonatype-work
        owner: nexus
        group: nexus 
        recurse: true
        state: directory

    - name: Insert/Update HTML surrounded by custom markers after <body> line
      blockinfile:
        path: /etc/systemd/system/nexus.service
        block: |
          [Unit]
          Description=nexus service
          After=network.target
          [Service]
          Type=forking
          LimitNOFILE=65536
          ExecStart=/opt/nexus-3.90.1-01/nexus/bin/nexus start
          ExecStop=/opt/nexus-3.90.1-01/nexus/bin/nexus stop
          User=nexus
          Restart=on-abort
          TimeoutSec=600
          [Install]
          WantedBy=multi-user.target

    - name: Recargar el daemon de systemd
      systemd:
        daemon_reload: true

    - name: Iniciar y habilitar Nexus service
      service:
        name: nexus.service
        state: started
        enabled: true 

- name: Instalar NGINX personalizado
  hosts: nginx
  remote_user: root

  tasks:
    - name: Configurar repositorio APT 
      blockinfile:
        path: /etc/apt/sources.list.d/nexus.sources 
        block: |
          deb http://<tu-ip-nexus>:8081/repository/apt-hosted/ jammy main
    
    - name: Actualizar repositorio
      apt:
        update_cache: yes

